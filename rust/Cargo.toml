[package]
name = "planfetch_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "planfetch_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.65"
aws-smithy-runtime-api = "1"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
thiserror = "2"
futures = "0.3"
