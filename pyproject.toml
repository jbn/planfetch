[project]
name = "planfetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John B Nelson", email = "jbn@abreka.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.19",
    "click>=8.0",
    "filelock>=3.20.2",
    "numpy>=2.4.0",
    "rich>=13.0",
    "torch>=2.9.1",
]

[project.scripts]
planfetch = "planfetch.cli:cli"

[project.optional-dependencies]
lightning = [
    "pytorch-lightning>=2.6.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "planfetch.planfetch_rs"
manifest-path = "rust/Cargo.toml"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytorch-lightning>=2.6.0",
]
